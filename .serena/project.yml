read_only: true
excluded_tools: []
included_optional_tools: []
fixed_tools: []
default_modes: []
added_modes: []
symbol_info_budget: 0.12
default_max_tool_answer_chars: 3500
read_only_memory_patterns:
- "^archive/.*"
ignored_memory_patterns:
- "^scratch/.*"

initial_prompt: |
  InkRoute is a pnpm/Turborepo TypeScript monorepo. Serena is a read-only one-jump router, not a research phase or edit surface.

  Activation rule:
  - On project activation, read only .serena/memories/inkroute/activation.md.
  - Use .serena/memories/inkroute/quickstart.md only when the task is about workflow/tool routing or route admission remains unclear.
  - Use .serena/memories/inkroute/routing-contract.md only after quickstart if the route is still unclear.
  - Do not enumerate or summarize every memory card unless the user explicitly asks for Serena workflow maintenance.

  Repo command policy:
  - Use RTK for repo shell commands.
  - Use rtk proxy powershell -NoProfile -Command "<scoped command>" for PowerShell builtins, pipelines, and raw shell behavior.
  - Do not require RTK inside package scripts, CI workflows, provider commands, or production automation.

  Tool-routing policy:
  - Serena is configured read-only for this repo. Make edits through Codex patching tools or RTK-scoped repo commands, not through Serena.
  - On this Windows workstation, Codex host config should launch Serena with C:\Users\domin\.local\bin\serena.exe and explicit startup/tool timeouts instead of a bare PATH-dependent serena command.
  - When activating, use the absolute project root C:\dev\InkRoute. Do not activate a parent folder, symlink, temp checkout, or generated summary directory.
  - Known file, route, helper, package, test, gap row, script, or CI seam: skip Serena and read the exact repo slice through RTK.
  - Bare request to activate Serena/current project: call live Serena activation if tools are available, then read only .serena/memories/inkroute/activation.md and stop.
  - Codex sessions may not expose live Serena MCP tools even when this repo config is healthy. If no callable Serena MCP tools are available, state that once; do not install or troubleshoot Serena unless the user asks to fix/optimize Serena.
  - For Serena maintenance, distinguish repo-side health from external MCP exposure: patch .serena/project.yml, cards, docs, router, or checker when they are wrong; otherwise report that live tool mounting is outside the repository and the host must attach or restart the Serena MCP server.
  - Unknown owner: use one Serena owner lookup, then RTK-read the located file.
  - Shared exported contract with unclear call sites: use one Serena references lookup before changing behavior.
  - If a request says to activate or use Serena and then find symbols, owners, references, call sites, or route/service boundaries, route to the semantic-lookup lane: activate the project if needed, read only activation.md, run one live owner/reference lookup, and do not misroute activation as Serena-maintenance.
  - If a bare activation request cannot use live Serena tools, state that once and do not turn tool unavailability into config work unless the user asked to fix/configure Serena.
  - Serena unavailable, noisy, credential-gated, or ambiguous after one follow-up: stop using Serena and fall back to scoped RTK search only when a concrete repo task remains.
  - Obsidian is project memory only; do not use it for current repo state, diffs, tests, or tracker evidence.

  Stable anchors when a task requires context:
  - AGENTS.md
  - CLAUDE.md
  - GAP_TRACKER.md
  - docs/ai/REPO_BRIEF.md
  - docs/ai/ARCHITECTURE_MAP.md
  - docs/ai/API_CONTRACTS.md
  - docs/ai/SERENA_OBSIDIAN_WORKFLOW.md

  Workflow surfaces:
  - docs/ai/SERENA_OBSIDIAN_WORKFLOW.md
  - .serena/project.yml
  - .serena/project.local.yml is a local-only override and must stay ignored
  - .serena/memories/inkroute/*
  - .serena/memories/inkroute/serena-health.md
  - scripts/workflow/route-serena-obsidian.mjs
  - scripts/workflow/check-serena-config.mjs
  - scripts/bootstrap-obsidian-vault.ps1
  - package.json workflow scripts

  Useful workflow commands:
  - rtk pnpm workflow:codex -- <task text>
  - rtk pnpm workflow:micro -- <task text>
  - rtk pnpm workflow:route:hot -- <task text>
  - rtk pnpm workflow:serena:check
  - rtk pnpm workflow:intake -- <task text>
  - rtk pnpm workflow:admit -- <task text>
  - rtk pnpm workflow:route:brief -- <task text>
  - rtk pnpm workflow:route:json -- <task text>

  One-shot discipline: name the smallest coherent file set, read each required file once, patch once, and do not run validation unless explicitly asked.

  Answer budget:
  - Keep live Serena answers under the configured compact response cap.
  - Keep activation failure answers short: repo-side config path, local health-check command if validation is requested, and the external MCP-mount boundary.
  - For routing decisions, prefer workflow:micro or workflow:route:hot over dumping full docs, router files, or memory cards.
  - For Serena maintenance, inspect narrow checker/router/config snippets first; do not full-read the canonical workflow doc unless the patch needs it.
