name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Phase 14 testing manifests
        run: pnpm test:phase14:static && pnpm test:manifest
      - name: Verify Phase 15 deployment manifests
        run: pnpm deploy:check-env && pnpm deploy:verify-provider-envs && pnpm deploy:verify-secrets && pnpm deploy:verify-mobile && pnpm deploy:verify-database-ops && pnpm deploy:verify-launch-evidence && pnpm deploy:verify-ops && pnpm deploy:checklist && pnpm deploy:gaps
      - name: Verify Phase 16 handoff manifests
        run: pnpm handoff:verify-docs && pnpm handoff:audit && pnpm handoff:next && pnpm handoff:verify-ledger && pnpm handoff:verify-tooling && pnpm handoff:verify-task-sync
      - name: Verify Phase 18 workspace runtime readiness
        run: pnpm workspace:imports && pnpm workspace:scripts && pnpm workspace:readiness && pnpm workspace:required-checks && pnpm workspace:toolchain
      - name: Verify Phase 17 quality gates
        run: pnpm quality:all
      - name: Verify PR GAP tracker diff evidence
        if: github.event_name == 'pull_request'
        run: pnpm quality:pr-gaps
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run unit tests with coverage
        run: pnpm test:unit:coverage
      - name: Run Phase 7 payment lifecycle contracts
        run: pnpm --filter @inkroute/payments test && pnpm vitest run apps/web/tests/payment-routes.test.ts apps/web/tests/stripe-webhook-static.test.ts apps/web/tests/payment-automation-static.test.ts apps/dashboard/tests/payment-operations-static.test.ts apps/dashboard/tests/payment-read-route-static.test.ts
      - name: Run Phase 8 calendar lifecycle contracts
        run: pnpm --filter @inkroute/calendar test && pnpm vitest run apps/web/tests/ics-feed-route.test.ts apps/web/tests/availability-preview-route.test.ts apps/web/tests/signed-ics-feed-static.test.ts apps/web/tests/calendar-automation-static.test.ts apps/dashboard/tests/availability-persistence-static.test.ts apps/dashboard/tests/google-calendar-sync-static.test.ts apps/dashboard/tests/timezone-recurrence-qa-static.test.ts apps/dashboard/tests/travel-publish-static.test.ts
      - name: Upload Vitest coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: |
            coverage/unit
            coverage/**/*.json
            coverage/**/*.lcov
          if-no-files-found: warn
      - name: Upload payment lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-lifecycle-artifacts
          path: |
            coverage/payment-*.json
            coverage/stripe-*-redacted.log
            coverage/playwright-payment-results.json
            test-results/payments
          if-no-files-found: warn
      - name: Upload calendar lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-lifecycle-artifacts
          path: |
            coverage/calendar-*.json
            coverage/signed-ics-*.json
            coverage/google-provider-redacted.json
            coverage/timezone-provider-matrix.json
            coverage/playwright-calendar-*.json
            coverage/playwright-public-travel-results.json
            test-results/calendar
            test-results/travel
          if-no-files-found: warn

      - name: Run Phase 9 notification and messaging lifecycle contracts
        run: pnpm --filter @inkroute/notifications test && pnpm vitest run apps/web/tests/notification-messaging-routes.test.ts apps/web/tests/provider-webhook-routes.test.ts apps/web/tests/provider-webhook-contracts.test.ts apps/web/tests/email-provider-static.test.ts apps/web/tests/sms-provider-static.test.ts apps/web/tests/preference-center-static.test.ts apps/web/tests/notification-automation-static.test.ts apps/dashboard/tests/template-read-route-static.test.ts apps/dashboard/tests/message-read-route-static.test.ts apps/dashboard/tests/notification-persistence-static.test.ts apps/dashboard/tests/notification-scheduler-static.test.ts apps/dashboard/tests/messaging-privacy-static.test.ts apps/mobile/tests/mobile-push-static.test.ts



      - name: Run Phase 10 SEO publication contracts
        run: pnpm --filter @inkroute/seo test && pnpm vitest run apps/dashboard/tests/seo-read-route-static.test.ts apps/dashboard/tests/seo-publication-route-static.test.ts apps/web/tests/sitemap-route.test.ts apps/web/tests/canonical-domain-runtime-static.test.ts apps/web/tests/structured-data-crawl-qa-static.test.ts

      - name: Upload structured data crawl artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-data-crawl-artifacts
          path: |
            coverage/structured-data-crawl.json
            coverage/rich-results-compatible-report.json
            coverage/sitemap-canonical-noindex-crawl.json
            coverage/unsupported-schema-review.json
            coverage/structured-data-closeout.md
            test-results/structured-data-crawl
          if-no-files-found: warn

      - name: Run Phase 10 SEO analytics attribution contracts
        run: pnpm --filter @inkroute/analytics test && pnpm vitest run apps/web/tests/seo-analytics-attribution-static.test.ts

      - name: Upload SEO analytics attribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-analytics-attribution-artifacts
          path: |
            coverage/seo-analytics-attribution.json
            coverage/seo-analytics-dashboard-report.json
            coverage/search-console-import-fixture.json
            coverage/playwright-seo-attribution-results.json
            test-results/seo-analytics
          if-no-files-found: warn

      - name: Run Phase 10 Search Console contracts
        run: pnpm --filter @inkroute/seo test && pnpm vitest run apps/dashboard/tests/search-console-route-static.test.ts

      - name: Upload Search Console artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-console-artifacts
          path: |
            coverage/search-console-provider-route.json
            coverage/search-console-dashboard-status.json
            coverage/search-console-import-fixture.json
            coverage/search-console-sitemap-submission-redacted.json
            test-results/search-console
          if-no-files-found: warn

      - name: Run Phase 10 SEO app runtime and build gate
        run: pnpm --filter @inkroute/testing test && pnpm --filter @inkroute/testing typecheck && pnpm --filter @inkroute/web build && pnpm --filter @inkroute/dashboard build && pnpm vitest run apps/web/tests/phase10-seo-runtime-build-static.test.ts apps/web/tests/sitemap-route.test.ts apps/web/tests/canonical-domain-runtime-static.test.ts apps/web/tests/structured-data-crawl-qa-static.test.ts apps/dashboard/tests/seo-read-route-static.test.ts apps/dashboard/tests/seo-publication-route-static.test.ts apps/dashboard/tests/search-console-route-static.test.ts

      - name: Upload Phase 10 SEO runtime/build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-seo-runtime-build-artifacts
          path: |
            coverage/phase10-seo-*.json
            coverage/phase10-dashboard-seo-*.json
            coverage/phase10-rendered-*.json
            coverage/phase10-sitemap-runtime.json
            coverage/phase10-api-preview-runtime.json
            coverage/phase10-canonical-runtime.json
            test-results/phase10-seo-web
            test-results/phase10-seo-dashboard
            test-results/structured-data-crawl
          if-no-files-found: warn

      - name: Run Phase 10 image SEO pipeline contracts
        run: pnpm --filter @inkroute/seo test && pnpm vitest run apps/dashboard/tests/image-seo-pipeline-static.test.ts

      - name: Upload image SEO pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-seo-pipeline-artifacts
          path: |
            coverage/image-seo-pipeline-plan.json
            coverage/image-seo-private-original-acl.json
            coverage/image-seo-public-derivative-load.json
            coverage/image-seo-cdn-headers.json
            coverage/lighthouse-image-seo-audit.json
            test-results/image-seo-pipeline
          if-no-files-found: warn

      - name: Run Phase 10 SEO automated test gate
        run: pnpm --filter @inkroute/seo test && pnpm --filter @inkroute/seo typecheck && pnpm vitest run apps/web/tests/seo-automated-tests-static.test.ts apps/web/tests/sitemap-route.test.ts apps/web/tests/canonical-domain-runtime-static.test.ts apps/web/tests/structured-data-crawl-qa-static.test.ts apps/web/tests/phase10-seo-runtime-build-static.test.ts apps/dashboard/tests/search-console-route-static.test.ts apps/dashboard/tests/image-seo-pipeline-static.test.ts

      - name: Upload SEO automated test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-automated-test-artifacts
          path: |
            coverage/seo-automated-test-gate.json
            coverage/phase10-seo-*.json
            coverage/structured-data-crawl.json
            coverage/image-seo-pipeline-plan.json
            coverage/search-console-provider-route.json
            test-results/seo-automated
          if-no-files-found: warn

      - name: Run Phase 11 observability runtime verification contracts
        run: pnpm --filter @inkroute/observability test && pnpm vitest run apps/web/tests/observability-runtime-verification-static.test.ts apps/web/tests/observability-routes.test.ts apps/dashboard/tests/error-report-route-static.test.ts

      - name: Upload observability runtime verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-runtime-verification-artifacts
          path: |
            coverage/observability-*.json
            coverage/observability-*.png
            coverage/observability-*-redacted.json
            coverage/observability-runtime-closeout.md
            test-results/observability/web
            test-results/observability/dashboard
            test-results/observability/mobile
          if-no-files-found: warn
      - name: Run Phase 9 app runtime and build gate
        run: pnpm --filter @inkroute/testing test && pnpm --filter @inkroute/testing typecheck && pnpm --filter @inkroute/web build && pnpm --filter @inkroute/dashboard build && pnpm --filter @inkroute/mobile typecheck && pnpm vitest run apps/web/tests/phase9-app-runtime-build-static.test.ts apps/web/tests/notification-messaging-routes.test.ts apps/web/tests/provider-webhook-routes.test.ts apps/web/tests/provider-webhook-contracts.test.ts apps/web/tests/booking-requests-contract.test.ts apps/web/tests/payment-routes.test.ts apps/dashboard/tests/template-read-route-static.test.ts apps/dashboard/tests/message-read-route-static.test.ts apps/dashboard/tests/messaging-privacy-static.test.ts apps/mobile/tests/mobile-push-static.test.ts
      - name: Upload notification messaging lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-messaging-lifecycle-artifacts
          path: |
            coverage/notification-*.json
            coverage/provider-sandbox-*-redacted.json
            coverage/preference-opt-out-persistence.json
            coverage/sms-stop-persistence.json
            coverage/retention-export-delete.json
            coverage/dashboard-*-smoke.json
            coverage/mobile-notification-smoke.json
            coverage/expo-push-device-qa-redacted.json
            coverage/playwright-notification-e2e-results.json
            test-results/notifications
            test-results/messaging
          if-no-files-found: warn

      - name: Upload Phase 9 app runtime/build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-app-runtime-build-artifacts
          path: |
            coverage/phase9-*.json
            coverage/phase9-*-redacted.json
            test-results/phase9-notifications
            test-results/phase9-dashboard
            test-results/phase9-mobile
          if-no-files-found: warn
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            coverage/playwright-report
            coverage/playwright-results.json
            coverage/playwright-junit.xml
            test-results
          if-no-files-found: warn












