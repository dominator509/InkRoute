name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Phase 14 testing manifests
        run: pnpm test:phase14:static && pnpm test:manifest
      - name: Verify Phase 15 deployment manifests
        run: pnpm deploy:check-env && pnpm deploy:verify-provider-envs && pnpm deploy:verify-secrets && pnpm deploy:verify-mobile && pnpm deploy:verify-database-ops && pnpm deploy:verify-launch-evidence && pnpm deploy:verify-ops && pnpm deploy:checklist && pnpm deploy:gaps
      - name: Verify Phase 16 handoff manifests
        run: pnpm handoff:verify-docs && pnpm handoff:audit && pnpm handoff:next && pnpm handoff:verify-ledger && pnpm handoff:verify-tooling && pnpm handoff:verify-task-sync
      - name: Verify Phase 18 workspace runtime readiness
        run: pnpm workspace:imports && pnpm workspace:scripts && pnpm workspace:readiness && pnpm workspace:required-checks && pnpm workspace:toolchain
      - name: Verify Phase 17 quality gates
        run: pnpm quality:all
      - name: Verify PR GAP tracker diff evidence
        if: github.event_name == 'pull_request'
        run: pnpm quality:pr-gaps
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run unit tests with coverage
        run: pnpm test:unit:coverage
      - name: Run Phase 7 payment lifecycle contracts
        run: pnpm --filter @inkroute/payments test && pnpm vitest run apps/web/tests/payment-routes.test.ts apps/web/tests/stripe-webhook-static.test.ts apps/web/tests/payment-automation-static.test.ts apps/dashboard/tests/payment-operations-static.test.ts apps/dashboard/tests/payment-read-route-static.test.ts
      - name: Upload Vitest coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: |
            coverage/unit
            coverage/**/*.json
            coverage/**/*.lcov
          if-no-files-found: warn
      - name: Upload payment lifecycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-lifecycle-artifacts
          path: |
            coverage/payment-*.json
            coverage/stripe-*-redacted.log
            coverage/playwright-payment-results.json
            test-results/payments
          if-no-files-found: warn
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            coverage/playwright-report
            coverage/playwright-results.json
            coverage/playwright-junit.xml
            test-results
          if-no-files-found: warn
