        run: pnpm --filter @inkroute/deployment test && pnpm vitest run apps/web/tests/launch-operations-runtime-static.test.ts

      - name: Upload Phase 15 launch operations runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-operations-runtime-artifacts
          path: |
            coverage/launch-operations-runtime.json
            coverage/launch-operations-verifier.json
            coverage/launch-operations-owner-coverage-redacted.json
            coverage/launch-operations-alert-routing-redacted.json
